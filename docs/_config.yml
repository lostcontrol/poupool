title: Poupool
description: Automated overflow swimming pool controller for Raspberry Pi and Arduino
url: https://lostcontrol.github.io
baseurl: /poupool
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme

color_scheme: poupool
logo: /images/logo.svg

search_enabled: true
search:
  heading_level: 3
  previews: 3
  focus_shortcut_key: "k"

heading_anchors: true
enable_copy_code_button: true

mermaid:
  version: "11.4.1"

aux_links:
  "GitHub Repository":
    - "https://github.com/lostcontrol/poupool"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Poupool is released under the <a href="https://github.com/lostcontrol/poupool/blob/master/LICENSE">GPL-2.0 License</a>.'

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/lostcontrol/poupool"
gh_edit_branch: "master"
gh_edit_source: "docs"
gh_edit_view_mode: "tree"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
